name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy-kiosk:
    name: Deploy Kiosk
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy-kiosk.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
